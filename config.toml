# ─────────────────────────────────────────────────────────────────────────────
# rpc-mesh  ·  SERVER config
#
# This file controls only the server's networking and probing behaviour.
# Provider endpoints are NOT defined here — they live in each client's own
# config.toml (rpc-client/config.toml, grpc-client/config.toml).
#
# To add or change providers, edit the config.toml inside the client you want
# to run, then restart that client.  The server needs no restart.
#
# You can also override any value with an env-var:
#   MESH_LISTEN_ADDR=0.0.0.0:50051  MESH_PROBE_INTERVAL_MS=250  cargo run
# ─────────────────────────────────────────────────────────────────────────────

# Address the mesh gRPC server listens on.
listen_addr = "[::1]:50051"

# How often (ms) the server probes each provider for health / slot lag.
probe_interval_ms = 500