# ─────────────────────────────────────────────────────────────────────────────
# rpc-mesh server config
# Both RpcMesh (JSON-RPC routing) and Geyser (Yellowstone streaming) services
# are served on the same port.  Add providers of each kind below.
# ─────────────────────────────────────────────────────────────────────────────

listen_addr       = "[::1]:50051"
probe_interval_ms = 500

# ── JSON-RPC providers (kind = "rpc") ─────────────────────────────────────────

[[providers]]
id   = "helius-rpc"
kind = "rpc"
url  = "https://mainnet.helius-rpc.com/?api-key=59fcb181-d11f-4358-b93c-85e8c2e8c298"

[[providers]]
id   = "shyft"
kind = "rpc"
url  = "https://rpc.shyft.to?api_key=Cad55tRqjnAiF8cR"

# ── Yellowstone geyser providers (kind = "geyser") ────────────────────────────
# These serve Geyser.Subscribe (account / slot / transaction streams).
# The mesh picks the best one using StableWs + LowestSlotLag scoring and
# automatically fails over if a stream drops.
#
# x_token is required for all production endpoints.
# For Helius:  your Helius API key (same key as the RPC url above)
# For Shyft:   your Shyft x-api-key (dashboard → API keys)
# For Triton:  the token shown in your rpcpool plan details


[[providers]]
id            = "svs"
kind          = "geyser"
grpc_endpoint = "https://basic.grpc.solanavibestation.com"
x_token       = "ba54f882ae6e4c0355837a45416ae676"

[[providers]]
id            = "shyft-geyser"
kind          = "geyser"
grpc_endpoint = "https://grpc.ny.shyft.to"
x_token       = "dd09cac0-f26c-4544-b653-4f887eeb32d2"

